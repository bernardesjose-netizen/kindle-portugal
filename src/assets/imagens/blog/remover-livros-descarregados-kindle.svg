<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="584" viewBox="0 0 1024 584" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">O que acontece ao ebook comprado</title>
  <desc id="descricao">Remover download apaga a cópia no Kindle e mantém o livro na conta. Excluir permanentemente apaga o livro da conta e dos aparelhos.</desc>
  <rect width="1024" height="584" rx="18" fill="#122d3a"/>
  <g font-family="Arial,sans-serif">
    <text x="55" y="77" fill="#fff7e8" font-family="Georgia,serif" font-size="47" font-weight="bold">O mesmo livro, duas escolhas</text>
    <text x="55" y="117" fill="#c4d9d5" font-size="23">Para uma compra da Kindle Store num Kindle posterior a 2012</text>
    <rect x="44" y="153" width="936" height="171" rx="16" fill="#e6f3ea"/>
    <g fill="none" stroke="#316a57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="78" y="191" width="63" height="88" rx="7"/><path d="M91 211h37m-37 12h28m-28 12h33m-19 28h10"/>
    </g>
    <text x="171" y="211" fill="#1b4639" font-size="35" font-weight="bold">Remover download</text>
    <text x="171" y="257" fill="#1f3933" font-size="27">No aparelho: a cópia é removida.</text>
    <text x="171" y="293" fill="#1f3933" font-size="27">Na conta: a compra continua na biblioteca.</text>
    <rect x="44" y="343" width="936" height="171" rx="16" fill="#f8e9db"/>
    <g fill="none" stroke="#985338" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M79 416h62m-56 0 5 51h40l5-51m-40-10h28m-23 23 20 20m0-20-20 20"/>
    </g>
    <text x="171" y="403" fill="#71412d" font-size="35" font-weight="bold">Excluir permanentemente</text>
    <text x="171" y="449" fill="#492f29" font-size="27">O título sai da conta e dos dispositivos.</text>
    <text x="171" y="485" fill="#492f29" font-size="27">Para o reler, a Amazon indica uma nova compra.</text>
    <text x="55" y="552" fill="#c4d9d5" font-size="21">Esquema editorial · Opções do manual do Kindle em português do Brasil</text>
  </g>
</svg>
