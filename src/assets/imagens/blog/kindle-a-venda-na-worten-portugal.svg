<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>O Kindle chega à Worten</title>
  <defs>
    <linearGradient id="fundo" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b111a"/><stop offset="1" stop-color="#142b49"/>
    </linearGradient>
    <radialGradient id="luz">
      <stop stop-color="#ffb94b" stop-opacity=".22"/><stop offset="1" stop-color="#ffb94b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fundo)"/>
  <ellipse cx="900" cy="300" rx="430" ry="380" fill="url(#luz)"/>
  <!-- saco de loja -->
  <g transform="translate(640 170)">
    <path d="M40 70 L260 70 L280 380 L20 380 Z" fill="#e3001b"/>
    <path d="M95 70 C95 10 205 10 205 70" fill="none" stroke="#e3001b" stroke-width="16" stroke-linecap="round"/>
    <path d="M40 70 L260 70 L264 120 L36 120 Z" fill="#000" opacity=".12"/>
  </g>
  <!-- Kindle -->
  <g transform="translate(830 150)">
    <rect width="200" height="290" rx="22" fill="#1f2d47" stroke="#2f4166" stroke-width="5"/>
    <rect x="16" y="20" width="168" height="232" rx="7" fill="#f4efe6"/>
    <g fill="#6b6257">
      <rect x="34" y="44" width="120" height="8" rx="4"/>
      <rect x="34" y="66" width="132" height="8" rx="4"/>
      <rect x="34" y="88" width="104" height="8" rx="4"/>
      <rect x="34" y="110" width="132" height="8" rx="4"/>
      <rect x="34" y="132" width="122" height="8" rx="4"/>
      <rect x="34" y="154" width="90" height="8" rx="4"/>
      <rect x="34" y="176" width="132" height="8" rx="4"/>
      <rect x="34" y="198" width="110" height="8" rx="4"/>
    </g>
  </g>
  <text x="70" y="150" font-family="Georgia, 'DejaVu Serif', serif" font-size="24" letter-spacing="4" fill="#ffb94b" font-weight="bold">NOVIDADE · NOVEMBRO DE 2026</text>
  <rect x="70" y="172" width="96" height="6" fill="#ffb94b"/>
  <text font-family="Georgia, 'DejaVu Serif', serif" font-size="58" fill="#ffffff" font-weight="bold">
    <tspan x="70" y="290">O Kindle já se</tspan>
    <tspan x="70" y="360">vende em</tspan>
    <tspan x="70" y="430">Portugal</tspan>
  </text>
  <text x="70" y="520" font-family="Georgia, 'DejaVu Serif', serif" font-size="26" fill="#cfd6e3">Worten e Amazon.es · kindleportugal.com</text>
</svg>
