<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="titulo" font-family="Arial,sans-serif">
  <title id="titulo">Um Kindle, duas lojas</title>
  <rect width="1200" height="630" fill="#142f3b"/>
  <text x="62" y="95" font-family="Georgia,serif" font-size="64" font-weight="bold" fill="#fff6e4">Um Kindle, duas lojas</text>
  <text x="65" y="151" font-size="31" fill="#c8dddc">Modelo de 6″ · 16 GB · com publicidade · grafite ou roxo</text>
  <rect x="60" y="194" width="525" height="337" rx="15" fill="#f6e7c9"/>
  <rect x="615" y="194" width="525" height="337" rx="15" fill="#d6e8e1"/>
  <g fill="#203e3d"><text x="95" y="254" font-size="34" font-weight="bold">Worten</text>
  <text x="92" y="348" font-family="Georgia,serif" font-size="77" font-weight="bold">124,99 €</text>
  <text x="95" y="415" font-size="30">Com recolha grátis em loja</text><text x="95" y="458" font-size="30">onde estiver disponível.</text>
  <text x="650" y="254" font-size="34" font-weight="bold">Amazon.es</text>
  <text x="648" y="348" font-family="Georgia,serif" font-size="58" font-weight="bold">Total na loja</text>
  <text x="650" y="415" font-size="30">Seleciona a cor, a morada</text><text x="650" y="458" font-size="30">e a modalidade de envio.</text></g>
  <text x="64" y="589" font-size="27" fill="#bfd4d4">Kindle Portugal · 27 de novembro de 2026 · 08h05 de Lisboa</text>
</svg>
