<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
 <title id="title">As parcelas do orçamento de um Kindle para oferecer</title>
 <desc id="desc">Leitor, acessórios necessários e entrega formam o total. Os extras dependem de quem recebe.</desc>
 <rect width="1200" height="675" fill="#142b36"/>
 <circle cx="1200" cy="0" r="290" fill="#294851"/>
 <text x="70" y="103" fill="#fffaf0" font-family="Georgia,serif" font-size="64" font-weight="700">Quanto vais pagar?</text>
 <g font-family="Arial,sans-serif" font-size="38" font-weight="700">
  <rect x="70" y="156" width="1060" height="112" rx="17" fill="#fffaf0"/>
  <text x="110" y="229" fill="#142b36">01</text><text x="226" y="229" fill="#142b36">LEITOR</text>
  <rect x="70" y="290" width="1060" height="112" rx="17" fill="#dce7df"/>
  <text x="110" y="363" fill="#34705a">02</text><text x="226" y="363" fill="#142b36">O QUE FAZ FALTA</text>
  <rect x="70" y="424" width="1060" height="112" rx="17" fill="#ead1aa"/>
  <text x="110" y="497" fill="#8b5c25">03</text><text x="226" y="497" fill="#142b36">ENTREGA</text>
 </g>
 <path d="M85 580h1030" stroke="#69818a" stroke-width="3"/>
 <text x="84" y="632" fill="#f2c178" font-family="Georgia,serif" font-size="42">O total vem antes dos extras.</text>
 <text x="1120" y="635" fill="#c5d2d4" text-anchor="end" font-family="Arial,sans-serif" font-size="21">Kindle Portugal</text>
</svg>
